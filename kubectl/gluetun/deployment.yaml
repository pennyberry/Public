---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: gluetun
    labels:
        app: gluetun
spec:
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: gluetun
    template:
        metadata:
            labels:
                app: gluetun
        spec:
            initContainers:
                - name: gluetun
                  restartPolicy: Always
                  image: qmcgaw/gluetun:v3
                  imagePullPolicy: Always
                  lifecycle:
                    postStart:
                      exec:
                        command: ["/bin/sh", "-c", "(ip rule del table 51820; ip -6 rule del table 51820) || true"]
                  securityContext:
                      capabilities:
                          add:
                              - 'NET_ADMIN'
                  envFrom:
                    - secretRef:
                        name: gluetun-secrets
                  volumeMounts:
                      - mountPath: /scripts
                        name: scripts
            containers:
                - name: qbittorrent
                  image: qbittorrentofficial/qbittorrent-nox:5.2.4-lt2-1
                  envFrom:
                    - secretRef:
                        name: gluetun-secrets
                  volumeMounts:
                    - mountPath: /config
                      name: nfs
                      subPath: applications/qbittorrent-nox/volumes/config
                    - mountPath: /downloads
                      name: nfs
                      subPath: applications/qbittorrent-nox/volumes/downloads
                - name: mousehole
                  image: tmmrtn/mousehole:latest
                  envFrom:
                    - secretRef:
                        name: gluetun-secrets
                  volumeMounts:
                    - mountPath: /var/lib/mousehole
                      name: nfs
                      subPath: applications/mousehole/                      
            volumes:
              - name: nfs
                persistentVolumeClaim:
                  claimName: truenas-pvc
              - name: scripts
                configMap:
                    name: gluetun-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: gluetun
  annotations:
    metallb.io/address-pool: internal-pool
    metallb.io/allow-shared-ip: "shared-ip"
spec:
  type: LoadBalancer
  selector:
    app: gluetun
  ports:
    - name: manage-http
      port: 8079
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gluetun-mousehole
  annotations:
    metallb.io/address-pool: internal-pool
    metallb.io/allow-shared-ip: "shared-ip"
spec:
  type: LoadBalancer
  selector:
    app: gluetun
  ports:
    - name: manage-http
      port: 5010
      targetPort: 5010      
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-ipallowlist-internal@kubernetescrd, kube-system-security-headers@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls.certresolver: myresolver
spec:
  tls:
    - hosts:
      - qbittorrent.joeberry.org
  rules:
  - host: qbittorrent.joeberry.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gluetun
            port:
              number: 8079
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent-ingress-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-ipallowlist-internal@kubernetescrd,kube-system-redirect-to-https@kubernetescrd
spec:
  rules:
  - host: qbittorrent.joeberry.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gluetun
            port:
              number: 8079
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mousehole-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-ipallowlist-internal@kubernetescrd, kube-system-security-headers@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls.certresolver: myresolver
spec:
  tls:
    - hosts:
      - mousehole.joeberry.org
  rules:
  - host: mousehole.joeberry.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gluetun-mousehole
            port:
              number: 5010
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mousehole-ingress-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-ipallowlist-internal@kubernetescrd,kube-system-redirect-to-https@kubernetescrd
spec:
  rules:
  - host: mousehole.joeberry.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gluetun-mousehole
            port:
              number: 5010              