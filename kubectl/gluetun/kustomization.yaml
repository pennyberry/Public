apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml

configMapGenerator:
  - name: gluetun-scripts
    files:
      - sync-port.sh

secretGenerator:
  - name: gluetun-secrets
    envs:
      - env-vars.env
    literals:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - SERVER_COUNTRIES=United States
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - VPN_PORT_FORWARDING=on
      # Spawn the port-sync watcher (detached, self-guarding) on every connect.
      # It waits for qBittorrent's WebUI and sets listen_port to the current
      # forwarded port so announced == reachable. See sync-port.sh.
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'nohup /bin/sh /scripts/sync-port.sh >/dev/null 2>&1 &'
      - PUID=0
      - PGID=0
      - WEBUI_PORT=8080
      - HTTPPROXY=off
      - SHADOWSOCKS=off
      - MOUSEHOLE_ALLOWED_HOSTS=mousehole.joeberry.org
      - MOUSEHOLE_ALLOWED_ORIGINS=https://mousehole.joeberry.org

generatorOptions:
  disableNameSuffixHash: true